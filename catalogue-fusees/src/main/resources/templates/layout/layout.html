<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="page(titre, contenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre + ' · Catalogue fusées'}">Catalogue fusées</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/main.js}" defer></script>
</head>
<body>
<header>
    <a class="brand" th:href="@{/}">CATALOGUE FUSÉES</a>
    <nav aria-label="Navigation">
        <a th:href="@{/fusees}">Fusées</a>
        <a th:href="@{/missions}">Missions</a>
        <a sec:authorize="hasAuthority('CLIENT')" th:href="@{/panier}">Panier</a>
        <a sec:authorize="hasAuthority('CLIENT')" th:href="@{/commandes}">Mes billets</a>
        <a sec:authorize="hasAuthority('ASTRONAUTE')" th:href="@{/astronaute}">Mes missions</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Connexion</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button class="link" type="submit">Déconnexion</button>
        </form>
    </nav>
</header>
<main th:replace="${contenu}"></main>
<footer>
    <a href="https://www.space.com/30568-moonshots-and-snapshots-of-project-apollo.html" target="_blank" rel="noopener">Photo : NASA · Apollo 7</a>
    <span>Projet fictif</span>
</footer>
</body>
</html>
